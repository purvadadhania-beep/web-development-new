<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Random Color Changer</title>
    <style>
        :root {
            --card-bg: rgba(248, 151, 151, 0.85)
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background 300ms ease, color 300ms ease;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        button {
            font-size: 1rem;
            padding: 10px 16px;
            margin-top: 12px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
        }

        .colorCode {
            margin-top: 12px;
            font-weight: 700;
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
        }
    </style>
</head>

<body>
    <main class="card" role="main">
        <h1>Random Color Changer</h1>
        <p>Click the button to change the page background to a random color.</p>
        <button id="changeBtn" aria-describedby="colorCode">Change color</button>
        <div class="colorCode" id="colorCode" aria-live="polite">#FFFFFF</div>
    </main>

    <script>
        const btn = document.getElementById('changeBtn');
        const codeEl = document.getElementById('colorCode');

        function randomHexColor() {
            // generate random hex in format #RRGGBB
            const hex = '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0').toUpperCase();
            return hex;
        }

        function setColor(hex) {
            document.body.style.background = hex;
            // choose black or white text for readable contrast using luminance approximation
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
            const textColor = luminance > 186 ? '#000000' : '#FFFFFF';
            document.body.style.color = textColor;
            // keep the card background slightly translucent so the UI is visible on all colors
            codeEl.textContent = hex;
            codeEl.style.color = textColor;
            btn.style.background = textColor === '#FFFFFF' ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.18)';
            btn.style.color = textColor === '#FFFFFF' ? '#FFFFFF' : '#000';
        }

        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const hex = randomHexColor();
            setColor(hex);
        });

        // initialize page with a random color on load
        setColor(randomHexColor());
    </script>
</body>

</html>
