<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To-Do List</title>
	<style>
		:root { --primary: #635bff; --dark: #1f2937; --muted: #6b7280; --light: #f4f6fb; }
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; display: grid; place-items: center;
			padding: 24px; font-family: Arial, sans-serif; color: var(--dark);
			background: linear-gradient(135deg, #e0e7ff, #f8fafc);
		}
		.app { width: min(100%, 560px); background: #fff; border-radius: 18px; padding: 28px;
			box-shadow: 0 15px 45px #27346920; }
		h1 { margin: 0 0 6px; text-align: center; font-size: 2rem; }
		#date-time { margin: 0 0 24px; text-align: center; color: var(--muted); font-size: .95rem; }
		.form { display: flex; gap: 10px; margin-bottom: 20px; }
		input { flex: 1; min-width: 0; padding: 13px 14px; border: 1px solid #d6d9e2;
			border-radius: 9px; font-size: 1rem; outline: none; }
		input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #635bff22; }
		button { border: 0; border-radius: 9px; padding: 0 18px; background: var(--primary);
			color: #fff; font-weight: bold; cursor: pointer; }
		button:hover { filter: brightness(.92); }
		ul { list-style: none; padding: 0; margin: 0; }
		li { display: flex; align-items: center; gap: 10px; padding: 13px 4px;
			border-bottom: 1px solid #edf0f5; }
		li span { flex: 1; overflow-wrap: anywhere; }
		li.done span { color: var(--muted); text-decoration: line-through; }
		.check { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
		.delete { padding: 7px 10px; background: #fee2e2; color: #b91c1c; font-size: .85rem; }
		#empty { display: block; padding: 22px 0; color: var(--muted); text-align: center; }
		.count { margin: 18px 0 0; color: var(--muted); font-size: .9rem; text-align: right; }
		@media (max-width: 430px) { .app { padding: 22px 18px; } .form { flex-wrap: wrap; }
			.form button { width: 100%; height: 44px; } }
	</style>
</head>
<body>
	<main class="app">
		<h1>My To-Do List</h1>
		<p id="date-time" aria-live="polite"></p>
		<form class="form" id="todo-form">
			<input id="todo-input" type="text" placeholder="What needs to be done?" aria-label="New task" maxlength="200" required>
			<button type="submit">Add Task</button>
		</form>
		<ul id="todo-list"></ul>
		<p id="empty">No tasks yet. Add one above!</p>
		<p class="count" id="count"></p>
	</main>
	<script>
		const form = document.querySelector('#todo-form');
		const input = document.querySelector('#todo-input');
		const list = document.querySelector('#todo-list');
		const empty = document.querySelector('#empty');
		const count = document.querySelector('#count');
		const tasks = [];

function updateDateTime (){
    document.queryselector('#data-time').textcontect=new Data().toLocaleString([],{
        weekday:'long',year:'numeric',month:'long',day:'numeric',
        hour:'2-digit',minute:'2-digit',second:'2-digit'
    });       
}

    function render() {
        list.innerHTML = '';
        tasks.forEach((task, index) => {
            const item = document.createElement('li');
            if (task.done) item.classList.add('done');
            item.innerHTML = `<input class="check" type="checkbox" ${task.done ? 'checked' : ''} aria-label="Mark task complete">
					<span>${escapeHtml(task.text)}</span><button class="delete" type="button">Delete</button>`;
            item.querySelector('.check').addEventListener('change', () => { task.done = !task.done; render(); });
            item.querySelector('.delete').addEventListener('click', () => { tasks.splice(index, 1); render(); });
            list.appendChild(item);
        });
        empty.style.display = tasks.length ? 'none' : 'block';
        count.textContent = `${tasks.length} task${tasks.length === 1 ? '' : 's'} total`;
    }
    

		function escapeHtml(text) {
			return text.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
		}
		form.addEventListener('submit', event => {
			event.preventDefault();
			const text = input.value.trim();
			if (text) { tasks.push({ text, done: false }); input.value = ''; render(); input.focus(); }
		});
		updateDateTime();
		setInterval(updateDateTime, 1000);
		render();
	</script>
</body>
</html>
