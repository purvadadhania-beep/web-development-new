<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            color: #1e293b;
        }

        .card {
            width: min(92%, 460px);
            padding: 2rem;
            border-radius: 18px;
            background: white;
            box-shadow: 0 12px 35px rgba(30, 41, 59, .16);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #4338ca;
        }

        p {
            color: #64748b;
        }

        input {
            width: 100%;
            padding: .85rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            margin-top: 1rem;
            padding: .8rem 1.5rem;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #result {
            min-height: 1.5em;
            margin-bottom: 0;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Palindrome Checker</h1>
        <p>Enter a word or phrase to see if it reads the same backward.</p>
        <form id="palindromeForm">
            <input id="userInput" type="text" placeholder="Enter text here" aria-label="Text to check" required>
            <button type="submit">Check Palindrome</button>
        </form>
        <p id="result" aria-live="polite"></p>
    </main>

    <script>
        const form = document.getElementById('palindromeForm');
        const input = document.getElementById('userInput');
        const result = document.getElementById('result');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const original = input.value.trim();
            const cleaned = original.toLowerCase().replace(/[^a-z0-9]/g, '');
            const reversed = cleaned.split('').reverse().join('');

            if (cleaned === reversed) {
                result.textContent = 'This is a Palindrome!';
                result.className = 'success';
            } else {
                result.textContent = 'This is not a palindrome.';
                result.className = 'error';
            }
        });
    </script>
</body>

</html>
